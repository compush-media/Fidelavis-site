<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Votre avis · Fidelavis</title>
    <style>
    :root {
      --fond: #F5F5F3;
      --carte: #FFFFFF;
      --encre: #17201B;
      --doux: #5F6B65;
      --vert: #1F7A55;
    }
    body {
      margin: 0;
      background: var(--fond);
      color: var(--encre);
      font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 48px 16px;
    }
    .carte {
      background: var(--carte);
      border-radius: 24px;
      padding: 24px 20px;
      box-shadow: 0 1px 2px rgba(23, 32, 27, 0.05);
    }
    h1 {
      font-size: 24px;
      line-height: 1.2;
      margin: 0 0 10px;
    }
    p {
      margin: 0 0 12px;
      color: var(--doux);
    }
    a.bouton {
      display: block;
      text-align: center;
      background: var(--vert);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      border-radius: 16px;
      padding: 16px;
      margin-top: 8px;
    }
    </style>
  </head>
  <body>
    <main>
      <section class="carte">
        <h1 id="titre">Merci pour votre confiance</h1>
        <p id="texte">Ouverture de la page Google pour donner votre avis…</p>
        <a class="bouton" id="bouton" href="#" hidden>Donner mon avis sur Google</a>
      </section>
    </main>
    <script>
      "use strict";
      // Lien du SMS de demande d'avis : fidelavis.com/a/?CODE ouvre la page d'avis Google du commerçant.
      const ADRESSE = "https://rtdiaeskmyjjwohirhzj.supabase.co/functions/v1/lien";
      const code = location.search.slice(1);
      const texte = document.getElementById("texte");
      const bouton = document.getElementById("bouton");
      fetch(ADRESSE, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "avis", code }),
      })
        .then((reponse) => reponse.ok ? reponse.json() : Promise.reject(reponse.status))
        .then(({ url, nom }) => {
          document.getElementById("titre").textContent = `Merci de la part de ${nom}`;
          texte.textContent = "Si la page Google ne s'ouvre pas toute seule, appuyez sur le bouton.";
          bouton.href = url;
          bouton.hidden = false;
          location.replace(url);
        })
        .catch(() => {
          texte.textContent = "Ce lien n'est plus valable. Merci tout de même pour votre confiance.";
        });
    </script>
  </body>
</html>
